name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

env:
  GOTOOLCHAIN: auto
  CGO_ENABLED: "0"
  IMAGE: ghcr.io/evilgenius79/tailwatch

jobs:
  binaries:
    name: Binaries and GitHub release
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Cross-compile (make cross)
        # builds the UI, then linux/amd64 arm64 arm, darwin/amd64 arm64,
        # windows/amd64, freebsd/amd64 for both binaries into ./dist
        run: make cross VERSION="${GITHUB_REF_NAME}" COMMIT="${GITHUB_SHA::7}"

      - name: Add install scripts and units to the release
        run: |
          cp scripts/install-agent.sh scripts/install-hub.sh dist/
          cp deploy/systemd/tailwatch.service deploy/systemd/tailwatch-agent.service dist/

      - name: SHA256SUMS
        run: |
          cd dist
          sha256sum tailwatch* install-*.sh > SHA256SUMS
          cat SHA256SUMS

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/tailwatch*
            dist/SHA256SUMS

      - name: Create GitHub release
        # Uses the gh CLI with the job's GITHUB_TOKEN instead of a third-party
        # action, so no external code runs with contents: write. A release that
        # already exists for the tag (e.g. drafted in the UI) gets its assets
        # replaced instead.
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -eu
          shopt -s failglob
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" --repo "$GITHUB_REPOSITORY" --clobber dist/*
          else
            args="--verify-tag --generate-notes --title $TAG"
            case "$TAG" in *-*) args="$args --prerelease" ;; esac
            # shellcheck disable=SC2086
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" $args dist/*
          fi

  image:
    name: Container image (ghcr.io)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ !contains(github.ref_name, '-') }}
          labels: |
            org.opencontainers.image.title=Tailwatch
            org.opencontainers.image.description=Tailscale network viewer and watchdog
            org.opencontainers.image.licenses=MIT

      - name: Build date
        id: date
        run: echo "date=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - name: Build and push (linux/amd64, linux/arm64)
        id: push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: deploy/docker/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ github.ref_name }}
            COMMIT=${{ github.sha }}
            DATE=${{ steps.date.outputs.date }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Attest image provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
