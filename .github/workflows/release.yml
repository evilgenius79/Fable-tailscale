name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

env:
  GOTOOLCHAIN: auto
  CGO_ENABLED: "0"
  IMAGE: ghcr.io/evilgenius79/tailwatch

jobs:
  binaries:
    name: Binaries and GitHub release
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Cross-compile (make cross)
        # builds the UI, then linux/amd64 arm64 arm, darwin/amd64 arm64,
        # windows/amd64, freebsd/amd64 for both binaries into ./dist
        run: make cross VERSION="${GITHUB_REF_NAME}" COMMIT="${GITHUB_SHA::7}"

      - name: Add install scripts and units to the release
        run: |
          cp scripts/install-agent.sh scripts/install-hub.sh dist/
          cp deploy/systemd/tailwatch.service deploy/systemd/tailwatch-agent.service dist/

      - name: SHA256SUMS
        run: |
          cd dist
          sha256sum tailwatch* install-*.sh > SHA256SUMS
          cat SHA256SUMS

      - name: Attest build provenance
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2.4.0
        with:
          subject-path: |
            dist/tailwatch*
            dist/SHA256SUMS

      - name: Create GitHub release
        # Uses the gh CLI with the job's GITHUB_TOKEN instead of a third-party
        # action, so no external code runs with contents: write. A release that
        # already exists for the tag (e.g. drafted in the UI) gets its assets
        # replaced instead.
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -eu
          shopt -s failglob
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" --repo "$GITHUB_REPOSITORY" --clobber dist/*
          else
            args="--verify-tag --generate-notes --title $TAG"
            case "$TAG" in *-*) args="$args --prerelease" ;; esac
            # shellcheck disable=SC2086
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" $args dist/*
          fi

  image:
    name: Container image (ghcr.io)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3.7.0

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5.10.0
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ !contains(github.ref_name, '-') }}
          labels: |
            org.opencontainers.image.title=Tailwatch
            org.opencontainers.image.description=Tailscale network viewer and watchdog
            org.opencontainers.image.licenses=MIT

      - name: Build date
        id: date
        run: echo "date=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - name: Build and push (linux/amd64, linux/arm64)
        id: push
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          file: deploy/docker/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ github.ref_name }}
            COMMIT=${{ github.sha }}
            DATE=${{ steps.date.outputs.date }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Attest image provenance
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2.4.0
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
